name: 功能建议
description: 提议通用能力或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户或部署者遇到的问题，而不是只描述实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: 影响范围
      options:
        - label: provider 或网关契约
        - label: 数据库迁移
        - label: 隐私或安全边界
        - label: 页面与可访问性
        - label: 文档和部署
